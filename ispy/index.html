<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>I Spy 📸 — Ketaki & Ash</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Lilita+One&family=Special+Elite&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #fdf2f0 0%, #f9e8e4 40%, #fceae6 100%);
    font-family: 'Quicksand', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px;
  }

  .back-btn {
    position: fixed; top: 12px; left: 12px; z-index: 100;
    background: rgba(255,255,255,0.9); border: none; border-radius: 20px;
    padding: 8px 16px; font-size: 0.85rem; font-weight: 700;
    color: #d4727a; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 8px rgba(212,114,122,0.15);
    text-decoration: none;
  }
  .back-btn:hover { background: #fff; }

  h1 {
    font-family: 'Sacramento', cursive; font-size: 2.6rem; color: #d4727a;
    margin-top: 10px; margin-bottom: 2px;
  }
  .tagline {
    font-family: 'Special Elite', cursive;
    font-size: 0.85rem; color: #b0636a; margin-bottom: 20px;
  }

  /* Checklist */
  .checklist {
    width: min(420px, 92vw);
    background: rgba(255,255,255,0.7);
    border-radius: 16px; padding: 20px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(212,114,122,0.12);
    box-shadow: 0 4px 20px rgba(212,114,122,0.06);
    margin-bottom: 20px;
  }
  .checklist-title {
    font-family: 'Lilita One', cursive;
    font-size: 1.1rem; color: #d4727a;
    margin-bottom: 14px; text-align: center;
    letter-spacing: 1px;
  }
  .spy-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    cursor: pointer; transition: background 0.15s;
    user-select: none; -webkit-user-select: none;
  }
  .spy-item:hover { background: rgba(212,114,122,0.06); }
  .spy-item.checked { opacity: 0.55; }
  .spy-item.checked .spy-text { text-decoration: line-through; }
  .spy-check {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2.5px solid #d4727a; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; transition: all 0.2s;
    background: #fff;
  }
  .spy-item.checked .spy-check {
    background: #d4727a; border-color: #d4727a; color: #fff;
  }
  .spy-emoji {
    font-size: 1.4rem; flex-shrink: 0; width: 30px; text-align: center;
  }
  .spy-text {
    font-size: 0.9rem; color: #4a3a3c; font-weight: 600;
    line-height: 1.3; transition: all 0.2s;
  }

  .score-bar {
    text-align: center; margin-bottom: 20px;
    font-family: 'Special Elite', cursive;
    font-size: 0.85rem; color: #9e5a60;
  }
  .score-bar .count {
    font-family: 'Lilita One', cursive;
    font-size: 1.3rem; color: #d4727a;
  }

  /* Divider */
  .divider {
    width: min(420px, 92vw);
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: rgba(212,114,122,0.25);
  }
  .divider-text {
    font-family: 'Special Elite', cursive;
    font-size: 0.8rem; color: #b89a9d;
    white-space: nowrap;
  }

  /* Upload section */
  .upload-section {
    width: min(420px, 92vw);
    background: rgba(255,255,255,0.7);
    border-radius: 16px; padding: 24px 20px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(212,114,122,0.12);
    box-shadow: 0 4px 20px rgba(212,114,122,0.06);
    text-align: center;
  }
  .upload-title {
    font-family: 'Lilita One', cursive;
    font-size: 1.1rem; color: #d4727a;
    margin-bottom: 8px;
  }
  .upload-desc {
    font-size: 0.85rem; color: #7a5c5f; margin-bottom: 16px;
    line-height: 1.5;
  }
  .upload-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #d4727a, #b85a62);
    color: #fff; text-decoration: none;
    padding: 14px 28px; border-radius: 30px;
    font-size: 1rem; font-weight: 700;
    font-family: 'Quicksand', sans-serif;
    box-shadow: 0 4px 16px rgba(212,114,122,0.3);
    transition: transform 0.2s, box-shadow 0.2s;
    border: none; cursor: pointer;
  }
  .upload-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(212,114,122,0.4);
  }
  .upload-btn:active { transform: translateY(0); }
  .upload-icon { font-size: 1.3rem; }

  .upload-note {
    margin-top: 12px; font-size: 0.75rem; color: #b89a9d;
    font-family: 'Special Elite', cursive;
  }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 24px;
    border-radius: 20px; font-size: 0.9rem; font-weight: 600;
    z-index: 200; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* Confetti burst */
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(120px) rotate(720deg); opacity: 0; }
  }
  .confetti {
    position: fixed; font-size: 1.5rem; pointer-events: none; z-index: 300;
    animation: confetti-fall 1.2s ease-out forwards;
  }

  /* Mobile */
  @media (max-width: 420px) {
    body { padding: 14px 12px 30px; }
    h1 { font-size: 2.2rem; }
    .tagline { font-size: 0.75rem; margin-bottom: 14px; }
    .checklist { padding: 14px; }
    .checklist-title { font-size: 1rem; margin-bottom: 10px; }
    .spy-item { padding: 8px 8px; gap: 10px; }
    .spy-check { width: 24px; height: 24px; font-size: 0.8rem; }
    .spy-emoji { font-size: 1.2rem; width: 26px; }
    .spy-text { font-size: 0.82rem; }
    .upload-section { padding: 18px 16px; }
    .upload-btn { padding: 12px 22px; font-size: 0.9rem; }
    .back-btn { padding: 6px 12px; font-size: 0.8rem; }
  }
  @media (max-height: 700px) and (max-width: 420px) {
    .spy-item { padding: 6px 8px; }
    .checklist { padding: 10px; }
  }
</style>
</head>
<body>

<a href="../index.html" class="back-btn">← Back</a>

<h1>I Spy 📸</h1>
<p class="tagline">Can you spot these moments? Check 'em off!</p>

<div class="score-bar">
  <span class="count" id="scoreCount">0</span> / <span id="scoreTotal">12</span> spotted
</div>

<div class="checklist" id="checklist"></div>

<div class="divider">
  <div class="divider-line"></div>
  <div class="divider-text">or just upload everything</div>
  <div class="divider-line"></div>
</div>

<div class="upload-section">
  <div class="upload-title">📤 Upload Photos</div>
  <p class="upload-desc">
    Got a bunch of pics? Upload them all at once — no limit!
    They go straight to our shared Google Drive.
  </p>
  <a href="https://drive.google.com/drive/folders/1rCRUADjqBGlzF9tzTkvQj9b_WNlXdTm1?usp=sharing" target="_blank" rel="noopener" class="upload-btn">
    <span class="upload-icon">📁</span>
    Open Drive & Upload
  </a>
  <p class="upload-note">You can select multiple photos at once</p>
</div>

<div class="toast" id="toast"></div>

<script>
const PROMPTS = [
  { emoji: '�', text: 'Group shot of your table' },
  { emoji: '🤪', text: 'A silly selfie' },
  { emoji: '😂', text: 'Bride & Groom candid laughs' },
  { emoji: '🌸', text: 'The prettiest floral arrangement' },
  { emoji: '🎶', text: 'The DJ/band in action' },
  { emoji: '💋', text: 'A little kiss' },
  { emoji: '🫂', text: 'A great big hug' },
  { emoji: '🍰', text: 'Yummy treats' },
  { emoji: '👗', text: 'Best dressed guest' },
  { emoji: '🕺', text: 'Guest with the dancing groove' },
  { emoji: '😭', text: 'Someone wiping away happy tears' },
  { emoji: '🤳', text: 'Someone taking a selfie' },
  { emoji: '🍛', text: 'Someone going back for seconds' },
  { emoji: '📍', text: 'Your favorite spot of the venue' },
  { emoji: '💃', text: 'Bhangra pose' },
  { emoji: '✨', text: 'The Bling' },
  { emoji: '🤝', text: 'Two people who just met becoming best friends' },
  { emoji: '🌅', text: 'The prettiest moment of the evening' },
];

// Load checked state from localStorage
const storageKey = 'ispy-checked';
let checked = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]'));

function render() {
  const container = document.getElementById('checklist');
  container.innerHTML = '';
  PROMPTS.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'spy-item' + (checked.has(i) ? ' checked' : '');
    item.innerHTML = `
      <div class="spy-check">${checked.has(i) ? '✓' : ''}</div>
      <div class="spy-emoji">${p.emoji}</div>
      <div class="spy-text">${p.text}</div>
    `;
    item.addEventListener('click', () => toggle(i));
    container.appendChild(item);
  });
  document.getElementById('scoreCount').textContent = checked.size;
  document.getElementById('scoreTotal').textContent = PROMPTS.length;
}

function toggle(i) {
  if (checked.has(i)) {
    checked.delete(i);
  } else {
    checked.add(i);
    burstConfetti();
    if (checked.size === PROMPTS.length) {
      setTimeout(() => showToast('🎉 You spotted EVERYTHING! Legend! 🏆'), 400);
    }
  }
  localStorage.setItem(storageKey, JSON.stringify([...checked]));
  render();
}

function burstConfetti() {
  const emojis = ['🎉', '✨', '⭐', '🌸', '💖', '🎊'];
  for (let i = 0; i < 6; i++) {
    const el = document.createElement('span');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (30 + Math.random() * 40) + '%';
    el.style.top = (20 + Math.random() * 20) + '%';
    el.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1500);
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

render();
</script>
</body>
</html>
